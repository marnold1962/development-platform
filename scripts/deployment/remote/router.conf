# Platform router. Routes /platform/<env>/<project>/... to container <project>-<env>:5000
# on network platform-net. Backends resolve at request time via Docker DNS, so a new
# project needs no edit here.
resolver 127.0.0.11 valid=10s ipv6=off;
server {
    listen 80;
    location = / { return 200 "platform router\n"; add_header Content-Type text/plain; }
    location ~ ^/platform/(?<env>dev|cert|prod)/(?<proj>[a-z][a-z0-9-]*)/(?<rest>.*)$ {
        set $backend "http://$proj-$env:5000/$rest$is_args$args";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Prefix /platform/$env/$proj;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @down;
    }
    location ~ ^/platform/(dev|cert|prod)/([a-z][a-z0-9-]*)$ { return 301 $uri/; }
    location @down { return 503 "backend down\n"; add_header Content-Type text/plain; }
}
