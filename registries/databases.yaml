# Database registry. Entries are added only from inspection (REG-4, REG-5).
# Inspected 2026-09-13 (read-only, catalog queries) for the devdesk import.
databases:
  epic-tracker:
    engine: postgresql
    host: aws-ec2
    database: epic_tracker
    access: read-only
    reach: "from the EC2 host only; credentials in /home/ubuntu/ai-analytics/.env.epic-tracker; schema dbo"
    verified: "2026-09-13"
  dev-planner:
    engine: postgresql
    host: aws-ec2
    database: dev_planner
    access: read-only
    reach: "from the EC2 host only; credentials in /home/ubuntu/ai-analytics/.env.dev-planner; schema public; attachments on disk at /home/ubuntu/dev-planner-data/attachments"
    verified: "2026-09-13"
